# Her push ve PR'da tip denetimi, lint, testler ve derleme. main'e giden push Vercel'de doğrudan
# üretime çıktığı için kırık bir commit en azından burada kırmızı görünsün.
name: Denetim

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Derleme Supabase'e bağlanmıyor; adresin yalnızca biçimi gerekiyor.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci
          NEXT_TELEMETRY_DISABLED: 1
